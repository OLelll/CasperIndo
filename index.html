<script>
/* ====== CONFIGURE AQUI (Supabase > Project Settings > API) ====== */
const SUPABASE_URL='https://auyxxkacfvdtbjvvgkpv.supabase.co';
const SUPABASE_KEY='sb_publishable_M66HVirWYdvEMKX40_DYyQ_U3V8b0zC';
const DOMINIO=/^[^@\s]+@al\.casperlibero\.edu\.br$/i;
const CURSOS=['Jornalismo','Publicidade e Propaganda','Rádio, TV e Internet','Relações Públicas'];

const fd=d=>d?d.split('-').reverse().join('/'):'';

const applyTheme=()=>{let t='auto';try{t=localStorage.getItem('tema')||'auto'}catch(e){}document.documentElement.classList.toggle('dk',t==='escuro'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches))};applyTheme();
const ready=!SUPABASE_URL.includes('COLE_');
const sb=ready?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const D=n=>S.D[n]||[];
const C=k=>(D('site_config').find(x=>x.chave===k)||{}).valor,cn=id=>(D('comunidades').find(c=>c.id===id)||{}).nome||'';
const nome=id=>(D('profiles').find(p=>p.id===id)||{}).nome||'Casperiano';
const eu=()=>S.me.id;
const toast=m=>{S.toast=m;render();setTimeout(()=>{S.toast='';render()},2600)};
async function load(){const r=await Promise.all(TABELAS.map(n=>sb.from(n).select('*')));TABELAS.forEach((n,i)=>S.D[n]=r[i].data||[])}
async function run(q,ok){const{error}=await q;if(error)return toast(error.message.replace(/^.*(Rolê lotado).*$/,'$1'));await load();render();if(ok)toast(ok)}

const Logo=()=>C('logo_url')?`<div class="logo"><img class="lg" src="${esc(C('logo_url'))}" alt="CásperIndo"></div>`:`<div class="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M33 8A16 16 0 1 0 33 32L26 25A7 7 0 1 1 26 15Z" fill="#0A23FF"/><path d="M37 11L21 29" stroke="var(--bg)" stroke-width="3"/></svg>CásperIndo</div>`;
const Win=(t,b)=>`<section class="card ret"><header><i></i>${t}</header><div>${b}</div></section>`;

const Setup=()=>`<div class="wrap center"><div class="card"><h2>Falta um passo</h2><p>Abra o <code>index.html</code> e cole a <strong>Project URL</strong> e a <strong>anon key</strong> do seu Supabase nas duas primeiras linhas do script.</p></div></div>`;

const Auth=()=>{const reg=S.mode==='reg';return `<div class="wrap center"><button class="bell" style="position:fixed;top:.8rem;right:.8rem;margin:0" data-act="tema" aria-label="Alternar tema claro ou escuro">☀/☾</button><div class="hero"><div class="logo" style="color:#fff">${C('logo_url')?`<img class="lg" src="${esc(C('logo_url'))}" alt="CásperIndo">`:'CásperIndo'}</div><h1>${esc(C('slogan')||'CHEGA de pessoas que não se sentem encaixadas!')}</h1><p style="position:relative;margin:0">${esc(C('lema')||'Uma vez Cásper, sempre Cásper.')}</p></div>
<div class="card"><div class="sw"><button class="btn sm ${reg?'alt':''}" data-act="mode" data-v="login">Entrar</button><button class="btn sm ${reg?'':'alt'}" data-act="mode" data-v="reg">Criar conta</button></div>
<form id="auth"><h2>Eaí? Bora conectar?</h2>
${reg?`<label for="nome">Nome completo</label><input id="nome" autocomplete="name" required><label for="curso">Curso</label><select id="curso">${CURSOS.map(c=>`<option>${c}</option>`).join('')}</select>`:''}
<label for="email">E-mail institucional</label><input id="email" type="text" inputmode="email" autocapitalize="none" placeholder="voce@al.casperlibero.edu.br" autocomplete="username" required>
<label for="senha">Senha</label><input id="senha" type="password" minlength="6" autocomplete="${reg?'new':'current'}-password" required>
${reg?`<label><input id="termo" type="checkbox" style="width:auto;margin-right:.4rem" required>Aceito os Termos de Uso e o Aviso de Privacidade (LGPD).</label><br><br>`:''}
${S.msg?`<p class="err" role="alert">${esc(S.msg)}</p>`:''}
<button class="btn" ${S.busy?'disabled':''}>${reg?'Criar minha conta':'Entrar'}</button></form></div></div>`};

const Search=()=>`<div class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A23FF" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" aria-label="Buscar" placeholder="Onde sair com a Cásper?" value="${esc(S.q)}"></div>`;

const Poll=p=>{const v=D('votos').filter(x=>x.enquete_id===p.id),mine=v.find(x=>x.user_id===eu());return `<div style="margin-bottom:1rem"><strong>${esc(p.pergunta)}</strong>${p.opcoes.map((o,i)=>{const n=v.filter(x=>x.opcao===i).length,pc=v.length?Math.round(n/v.length*100):0;return `<button class="bar ${mine&&mine.opcao===i?'me':''}" data-act="votar" data-id="${p.id}" data-i="${i}" ${mine?'disabled':''}><span style="width:${pc}%"></span><em>${esc(o)} · ${pc}%</em></button>`}).join('')}<div class="meta">${v.length} voto(s)${mine?' · valeu pelo voto!':''}</div></div>`};

const meP=()=>D('profiles').find(p=>p.id===eu())||{};
const sup=()=>!!meP().super;
const Av=(id,sz=36)=>{const p=D('profiles').find(x=>x.id===id)||{nome:'?'},st=`width:${sz}px;height:${sz}px`;return p.avatar_url?`<img class="av" style="${st}" src="${esc(p.avatar_url)}" alt="" loading="lazy">`:`<span class="av" style="${st};background:${esc(p.cor||'#0A23FF')};font-size:${Math.round(sz*.45)}px" aria-hidden="true">${esc((p.nome||'?')[0].toUpperCase())}</span>`};
const CAv=(c,sz=44)=>{const st=`width:${sz}px;height:${sz}px;border-radius:30%`;return c.avatar_url?`<img class="av" style="${st}" src="${esc(c.avatar_url)}" alt="" loading="lazy">`:`<span class="av" style="${st};background:var(--ind);font-size:${Math.round(sz*.42)}px" aria-hidden="true">${esc((c.nome||'?')[0].toUpperCase())}</span>`};
const L=x=>x&&typeof x==='object'?(x.midias&&x.midias.length?x.midias:(x.midia_url?[{url:x.midia_url,tipo:x.midia_tipo}]:[])):[];
const dsc=(a,b)=>a.created_at<b.created_at?1:-1,asc=(a,b)=>a.created_at<b.created_at?-1:1;
const ago=d=>{const s=(Date.now()-new Date(d))/1000;return s<60?'agora':s<3600?Math.floor(s/60)+' min':s<86400?Math.floor(s/3600)+' h':Math.floor(s/86400)+' d'};
const Media=(a,t)=>{const l=typeof a==='object'?L(a):(a?[{url:a,tipo:t}]:[]);if(!l.length)return'';const n=l.length;
return `<div class="car"><div class="trk">${l.map(m=>`<div class="sl">${m.tipo==='video'?`<video src="${esc(m.url)}" controls preload="metadata" playsinline></video>`:`<img src="${esc(m.url)}" alt="Foto da publicação" loading="lazy">`}</div>`).join('')}</div>${n>1?`<span class="cnt">1/${n}</span><button type="button" class="cb l" data-act="car" data-d="-1" aria-label="Anterior">‹</button><button type="button" class="cb r" data-act="car" data-d="1" aria-label="Próxima">›</button>`:''}</div>`};
const MAPS=r=>'https://www.google.com/maps/search/?api=1&query='+(r.local_lat?r.local_lat+','+r.local_lng:encodeURIComponent(r.local||''));
const resize=(file,max,png)=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error('Imagem inválida')),png?'image/png':'image/jpeg',.82)};im.onerror=()=>no(new Error('Imagem inválida'));im.src=URL.createObjectURL(file)});
async function upload(file,max=1280,png=false){const img=file.type.startsWith('image/'),vid=file.type.startsWith('video/');if(!img&&!vid)throw new Error('Envie só fotos ou vídeos.');if(vid&&file.size>25*1048576)throw new Error('Vídeo grande demais (máximo 25 MB).');let blob=file,ct=file.type,ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
 if(img&&file.type!=='image/gif'){blob=await resize(file,max,png);ct=png?'image/png':'image/jpeg';ext=png?'png':'jpg'}
 const path=eu()+'/'+Date.now()+'.'+ext,{error}=await sb.storage.from('midia').upload(path,blob,{contentType:ct});if(error)throw new Error(error.message);return{url:sb.storage.from('midia').getPublicUrl(path).data.publicUrl,tipo:img?'imagem':'video'}}
