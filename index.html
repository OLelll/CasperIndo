<style>
:root{--ind:#14006E;--ele:#0A23FF;--cob:#0047AB;--per:#7B9FD0;--bg:#F4F7FF;--card:#fff;--tint:#ECF1FF;--ink:#0E0B2B;--mut:#5f6082;--line:#D8E1F7;--r:24px}
:root.dk{--bg:#0A0826;--card:#141039;--tint:#1B1650;--ink:#F3F3FF;--mut:#A6A9D3;--line:#2B2768;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Outfit,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque',Outfit,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0 0 .5em}
h2{font-size:1.5rem}h3{font-size:1.25rem}
:focus-visible{outline:3px solid var(--ele);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--ele);color:#fff;border:0;border-radius:14px;padding:.65em 1.3em;font-weight:600;cursor:pointer;transition:transform .12s,background .12s}
.btn:hover{background:var(--ind)}.btn:active{transform:scale(.97)}.btn:disabled{background:var(--line);color:var(--mut);cursor:not-allowed}
.btn.alt{background:var(--tint);color:var(--ink)}.btn.alt:hover{background:var(--line)}.btn.sm{padding:.4em 1em;font-size:.9rem;border-radius:12px}
input,select,textarea{width:100%;padding:.75em 1em;border:1.5px solid var(--line);border-radius:14px;background:var(--card);margin:.25em 0 .9em}
input:focus,select:focus,textarea:focus{border-color:var(--ele);outline:0;box-shadow:0 0 0 4px #0a23ff22}
label{font-weight:600;font-size:.88rem}
.wrap{max-width:1040px;margin:auto;padding:1.4rem 1.1rem 5rem}
.card{background:var(--card);border-radius:var(--r);padding:1.3rem;margin-bottom:1rem;border:1px solid var(--line)}
.card.ret{background:none;border:0;padding:0;margin-bottom:2.2rem;overflow:visible}
.card.ret>header{display:block;font:800 1.5rem 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;padding:0 .2rem .7rem}
.card.ret>header::first-letter{text-transform:uppercase}.card.ret>header i{display:none}
.card.ret>div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.3rem}
.card.ret>div .card{background:var(--tint);border-color:transparent}
.card.ret>div .card:last-child,.card.ret>div p:last-child{margin-bottom:0}
nav.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
nav .row{display:flex;align-items:center;gap:.8rem;max-width:1040px;margin:auto;padding:.7rem 1.1rem}
